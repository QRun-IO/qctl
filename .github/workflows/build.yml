name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Run tests
        run: mvn clean verify -q

  build-native:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: qctl-linux-amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            artifact: qctl-linux-arm64
            arch: arm64
          - os: macos-15
            artifact: qctl-macos-amd64
            arch: amd64
          - os: macos-14
            artifact: qctl-macos-arm64
            arch: arm64
          - os: windows-latest
            artifact: qctl-windows-amd64.exe
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build native image
        run: mvn clean package -DskipTests -Pnative -q

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: mv qctl-cli/target/qctl qctl-cli/target/${{ matrix.artifact }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        run: mv qctl-cli/target/qctl.exe qctl-cli/target/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: qctl-cli/target/${{ matrix.artifact }}

  release:
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  docker:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qctl-linux-*
          path: .
          merge-multiple: true

      - name: Prepare binaries
        run: |
          mv qctl-linux-amd64/qctl-linux-amd64 qctl-linux-amd64.bin
          mv qctl-linux-arm64/qctl-linux-arm64 qctl-linux-arm64.bin
          mv qctl-linux-amd64.bin qctl-linux-amd64
          mv qctl-linux-arm64.bin qctl-linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/qrun-io/qctl:${{ github.ref_name }}
            ghcr.io/qrun-io/qctl:latest

  update-packages:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update package manifests
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}"

          SHA_MACOS_ARM64=$(shasum -a 256 artifacts/qctl-macos-arm64/qctl-macos-arm64 | cut -d' ' -f1)
          SHA_MACOS_AMD64=$(shasum -a 256 artifacts/qctl-macos-amd64/qctl-macos-amd64 | cut -d' ' -f1)
          SHA_LINUX_AMD64=$(shasum -a 256 artifacts/qctl-linux-amd64/qctl-linux-amd64 | cut -d' ' -f1)
          SHA_LINUX_ARM64=$(shasum -a 256 artifacts/qctl-linux-arm64/qctl-linux-arm64 | cut -d' ' -f1)
          SHA_WINDOWS=$(shasum -a 256 artifacts/qctl-windows-amd64.exe/qctl-windows-amd64.exe | cut -d' ' -f1)

          # Update Homebrew
          sed -i "s/version \".*\"/version \"${VERSION}\"/" HomebrewFormula/qctl.rb
          sed -i "s/PLACEHOLDER_ARM64_SHA256/${SHA_MACOS_ARM64}/" HomebrewFormula/qctl.rb
          sed -i "s/PLACEHOLDER_AMD64_SHA256/${SHA_MACOS_AMD64}/" HomebrewFormula/qctl.rb
          sed -i "s/PLACEHOLDER_LINUX_AMD64_SHA256/${SHA_LINUX_AMD64}/" HomebrewFormula/qctl.rb
          sed -i "s/PLACEHOLDER_LINUX_ARM64_SHA256/${SHA_LINUX_ARM64}/" HomebrewFormula/qctl.rb

          # Update Scoop
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" scoop/qctl.json
          sed -i "s|/v[0-9.]*\/|/v${VERSION}/|g" scoop/qctl.json
          sed -i "s/PLACEHOLDER_WINDOWS_SHA256/${SHA_WINDOWS}/" scoop/qctl.json

          # Update AUR
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" aur/PKGBUILD
          sed -i "s/PLACEHOLDER_LINUX_SHA256/${SHA_LINUX_AMD64}/" aur/PKGBUILD

      - name: Commit package updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add HomebrewFormula/qctl.rb scoop/qctl.json aur/PKGBUILD
          git commit -m "chore(packages): update manifests to ${GITHUB_REF_NAME}"
          git push
